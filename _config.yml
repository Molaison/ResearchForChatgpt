title: ResearchForChatgpt
description: Agent-generated research reports rendered as a GitHub Pages site.
url: "https://molaison.github.io"
baseurl: "/ResearchForChatgpt"
lang: zh-CN
encoding: UTF-8
timezone: Asia/Tokyo
markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

defaults:
  - scope:
      path: "research"
    values:
      layout: report

exclude:
  - skills
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
